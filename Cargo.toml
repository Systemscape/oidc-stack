[package]
name = "oidc-stack"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "OIDC building blocks: JWKS bearer-token validation for dropshot APIs and an axum-oidc session/CSRF stack for BFF web services"
repository = "https://github.com/Systemscape/oidc-stack"
publish = false

[dependencies]
# Core (always compiled): discovery preflight
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
] }
serde = { version = "1.0.229", features = [ "derive" ] }
thiserror = "2.0.20"
tracing = "0.1.44"
url = { version = "2.5.8", features = [ "serde" ] }

# validator
arc-swap = { version = "1.9.2", optional = true }
jsonwebtoken = { version = "=10.4.0", optional = true, features = [ "aws_lc_rs" ] }
jwks = { version = "0.5.3", optional = true, default-features = false, features = [ "aws_lc_rs" ] }
tokio = { version = "1.53.1", optional = true, features = [ "rt", "time" ] }

# dropshot
async-trait = { version = "0.1.92", optional = true }
dropshot = { version = "0.17.1", optional = true }
schemars = { version = "=0.8", optional = true } # only this version is supported by dropshot
secrecy = { version = "0.10.3", optional = true, features = [ "serde" ] }

# bff
axum = { version = "0.8.9", optional = true }
# Fork: absorbs a refused refresh token instead of erroring, and does not clear
# the session when it does. Back to crates.io once that is released upstream.
axum-oidc = { git = "https://codeberg.org/julidi/axum-oidc.git", rev = "c356510de72df9f4ecbf6aed53abc3e5ddc024b4", optional = true }
time = { version = "0.3.55", optional = true }
tower = { version = "0.5.3", optional = true }
tower-http = { version = "0.7.0", optional = true, features = [ "csrf" ] }
tower-sessions = { version = "0.15.0", optional = true, features = [ "signed" ] }

# signed-request
chrono = { version = "0.4.45", optional = true, default-features = false, features = [ "clock" ] }
hex = { version = "0.4.3", optional = true }
hmac = { version = "0.13.0", optional = true }
sha2 = { version = "0.11.0", optional = true }
subtle = { version = "2.6.1", optional = true }

[dev-dependencies]
base64 = "0.23.1"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = [ "macros", "rt-multi-thread" ] }
# memory-store: session store for the bff_axum example
tower-sessions = { version = "0.15.0", features = [ "signed", "memory-store" ] }
wiremock = "0.6.5"

[[example]]
name = "dropshot_api"
required-features = ["dropshot"]

[[example]]
name = "bff_axum"
required-features = ["bff"]

[features]
default = []
# Local JWT validation against a cached, background-refreshed JWKS
# (resource servers accepting bearer tokens). Framework-free.
validator = ["dep:arc-swap", "dep:jsonwebtoken", "dep:jwks", "dep:tokio"]
# Dropshot extractor on top of `validator`.
dropshot = [
    "validator",
    "dep:async-trait",
    "dep:dropshot",
    "dep:schemars",
    "dep:secrecy",
]
# axum-oidc + tower-sessions SSO stack (login flow, session cookie, CSRF).
bff = [
    "dep:axum",
    "dep:axum-oidc",
    "dep:time",
    "dep:tokio",
    "dep:tower",
    "dep:tower-http",
    "dep:tower-sessions",
]
# Reverse-proxy helpers forwarding requests with the session's bearer token.
proxy = ["bff"]
# HMAC-SHA256 signed-request primitive for inter-service authentication.
signed-request = [
    "dep:chrono",
    "dep:hex",
    "dep:hmac",
    "dep:secrecy",
    "dep:sha2",
    "dep:subtle",
]
